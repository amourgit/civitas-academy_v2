<!doctype html>
<html lang="en">
  <head>
    <script>
      // Fix for iframe environments where window.fetch has only a getter and crashes on reassignment
      (function() {
        try {
          if (typeof window !== 'undefined' && window.fetch) {
            var originalFetch = window.fetch;
            var currentFetch = originalFetch;
            
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return currentFetch;
              },
              set: function(val) {
                currentFetch = val;
              }
            });
          }
        } catch (e) {
          console.warn('Could not patch window.fetch setter in head:', e);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CIVITAS Academy - Formations d'Excellence IA & Automatisation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
